autoInstallPeers: true
blockExoticSubdeps: true
catalogMode: prefer
cleanupUnusedCatalogs: true
enableGlobalVirtualStore: true
engineStrict: true
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "@biomejs/*"
  - "@jsr/cliffy__*"
  - "@oxfmt/*"
  - "@oxlint/*"
  - "@pobammer-ts/small-rules"
  - "@tsrs/*"
  - oxfmt
  - oxlint
  - skills
  - tsrs

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeStrict: true
resolutionMode: time-based
shamefullyHoist: false
shellEmulator: true
strictDepBuilds: true
strictPeerDependencies: false
# CI re-verifies the lockfile; local installs still check newly resolved packages.
trustLockfile: true
trustPolicy: no-downgrade

trustPolicyExclude:
  - "@tsrs/*"
  - skills
  - tsrs

trustPolicyIgnoreAfter: 10080
lockfile: true

packages:
  - apps/*
  - documentation/*
  - packages/*
  - scripts
  - tools/*
  - turbo/generators

overrides:
  "@isentinel/eslint-config>@e18e/eslint-plugin": catalog:lint
  "@isentinel/eslint-config>@pobammer-ts/small-rules": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-antfu": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-better-max-params": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-comment-length": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-de-morgan": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-eslint-plugin": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-flawless": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-jest-extended": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-jsdoc": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-n": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-oxfmt": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-perfectionist": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-pnpm": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-react-jsx": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-react-naming-convention": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-react-x": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-roblox-ts": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-sonarjs": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-unicorn": catalog:lint
  "@isentinel/eslint-config>eslint-plugin-unused-imports": catalog:lint
  "@vitiate/core>@swc/core": 1.15.41
  # vite-plus's core is Vite 8 with the same API, so Astro and Vitest run on it.
  vite: catalog:tooling

# Vitest 5 matches `testNamePattern` against `task.fullTestName`, which joins suite names with
# " > ". The runner builds its per-mutant filter by joining them with " ", so the regex matches
# nothing for any test inside a `describe` and every mutant runs zero tests and is reported
# "Survived". Drop this once upstream supports Vitest 5.
patchedDependencies:
  "@stryker-mutator/vitest-runner@10.0.0": patches/@stryker-mutator__vitest-runner@10.0.0.patch

catalogs:
  ai:
    "@openrouter/sdk": 1.5.99
    "@tmcp/adapter-arktype": 0.2.4
    "@tmcp/transport-in-memory": 0.1.1
    "@tmcp/transport-stdio": 0.5.1
    tmcp: 1.20.1
  build:
    "@arethetypeswrong/core": 0.18.5
    oxc-transform-react: 0.158.0
    publint: 0.3.25
    rolldown: 1.3.2
    tsdown: 0.23.7
    unplugin-macros: 0.23.4
    unrun: 0.3.1
  commitlint:
    "@commitlint/cli": 21.2.4
    "@commitlint/config-conventional": 21.2.4
    "@commitlint/types": 21.2.3
  dev:
    empathic: 2.1.0
    tinyexec: 1.3.1
  documentation:
    "@astrojs/check": 0.9.12
    "@astrojs/react": 7.1.8
    "@astrojs/starlight": 0.42.11
    "@fontsource-variable/ibm-plex-sans": 5.3.0
    "@fontsource-variable/newsreader": 5.3.0
    "@fontsource/ibm-plex-mono": 5.3.0
    astro: 7.4.11
    react-dom: 19.3.1
  lint:
    "@biomejs/biome": 2.6.7
    "@e18e/eslint-plugin": 0.8.1
    "@isentinel/eslint-config": 6.4.0
    "@pobammer-ts/small-rules": 3.12.0
    "@stylistic/eslint-plugin": 5.10.0
    "@vitest/eslint-plugin": 1.6.28
    eslint: 10.14.0
    eslint-plugin-antfu: 3.3.1
    eslint-plugin-better-max-params: 1.0.0
    eslint-plugin-comment-length: 2.3.1
    eslint-plugin-de-morgan: 2.3.0
    eslint-plugin-eslint-plugin: 7.6.2
    eslint-plugin-flawless: 1.16.2
    eslint-plugin-jest-extended: 3.0.1
    eslint-plugin-jsdoc: 65.4.5
    eslint-plugin-n: 18.5.0
    eslint-plugin-oxfmt: 0.33.0
    eslint-plugin-perfectionist: 5.13.0
    eslint-plugin-pnpm: 1.9.1
    eslint-plugin-react-jsx: 5.30.2
    eslint-plugin-react-naming-convention: 5.30.2
    eslint-plugin-react-x: 5.30.2
    eslint-plugin-roblox-ts: 1.4.1
    eslint-plugin-sonarjs: 4.2.2
    eslint-plugin-unicorn: 79.0.0
    eslint-plugin-unused-imports: 4.4.1
    fallow: 3.42.0
    oxfmt: 0.78.0
    oxlint: 1.93.0
    oxlint-plugin-react-doctor: 0.9.22
    oxlint-tsgolint: 7.0.2007
  # Published packages declare `engines.node >=22.18.0`, so they typecheck
  # against that floor instead of the Node 26 that mise runs.
  node-floor:
    "@types/node": ~26.6.6
  packages:
    jsonc-parser: 3.3.1
    just-diff: 6.0.2
  polyfills:
    temporal-polyfill: 1.0.8
  runtime:
    "@ark/util": 0.56.8
    "@arkenv/core": 1.0.0-rc.4
    "@clack/core": 1.6.0
    "@clack/prompts": 1.9.0
    "@cliffy/command": jsr:1.3.1
    "@cliffy/table": jsr:1.3.1
    "@xterm/headless": 6.0.0
    ansis: 4.5.0
    arktype: 2.2.9
    c12: 4.0.0-rc.4
    confbox: 0.3.2
    consola: 3.4.2
    effect: 4.1.4
    env-paths: 4.0.0
    fast-string-width: 3.0.2
    fzf: 0.5.2
    ink: 7.1.1
    picomatch: 4.0.7
    pretty-bytes: 7.2.0
    react: 19.3.1
    sharp: 0.35.5
    tinyglobby: 0.2.17
    yaml: 2.9.1
  test:
    "@stryker-mutator/api": 10.0.0
    "@stryker-mutator/core": 10.0.0
    "@stryker-mutator/vitest-runner": 10.0.0
    "@total-typescript/shoehorn": 0.1.2
    "@vitest/coverage-istanbul": 5.1.0
    "@vitest/coverage-v8": 5.1.0
    "@vitiate/core": 0.3.1
    fast-check: 4.10.2
    jest-extended: 7.0.0
    vitest: 5.1.0
    vitiate: 0.3.1
  tooling:
    "@isentinel/hooks": 1.7.0
    "@mdx-js/language-server": 0.6.4
    "@pobammer-ts/lsp-mux": 3.2.0
    "@turbo/gen": 2.11.11
    bumpp: 12.3.0
    jiti: 2.7.0
    pncat: 0.13.4
    sfw: 2.0.6
    skills: 1.8.1
    tsrs: 0.25.0-ts7.1.0-beta
    turbo: 2.11.11
    typescript: npm:@typescript/typescript6@^6.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  types:
    "@total-typescript/ts-reset": 0.6.1
    # eslint-disable-next-line pnpm/yaml-no-duplicate-catalog-item -- completely separate versions.
    "@types/node": ^26.6.6
    "@types/picomatch": 4.0.3
    "@types/react": 19.3.0
    "@types/react-dom": 19.3.0
    type-fest: 5.10.0

allowBuilds:
  "@openrouter/sdk": true
  "@swc/core": true
  esbuild: true
  sharp: true

packageExtensions:
  # astro2tsx pins @emnapi/core 1.11.3 but leaves @emnapi/runtime to the
  # auto-installed peer, which resolved to 2.0.0-beta.2. The mismatched pair
  # crashes `astro check` with "this.bridge.setLastError is not a function".
  "@astrojs/astro2tsx@0.1.3":
    dependencies:
      "@emnapi/runtime": 1.11.3
  # These import ink or react without declaring them, so the isolated store
  # can't resolve them.
  "@stryker-mutator/core@10.0.0":
    dependencies:
      "@stryker-mutator/vitest-runner": 10.0.0
      typescript: 5.9.3
  ink-testing-library@4.0.0:
    peerDependencies:
      ink: ">=5.0.0"
  # The patched getExePath falls back to TypeScript's own compiler on Windows
  # when the @tsrs platform binary is missing.
  tsrs@0.18.0-ts7.1.0-dev.20260929:
    optionalDependencies:
      "@typescript/typescript-win32-arm64": 7.1.0-dev.20260930.4
      "@typescript/typescript-win32-x64": 7.1.0-dev.20260930.4

peerDependencyRules:
  # vite resolves to vite-plus's core, which carries its own version number.
  allowAny:
    - vite
  allowedVersions:
    "@emnapi/core": ">=1.0.0"
    "@emnapi/runtime": ">=1.0.0"
    "@typescript-eslint/*>typescript": ">=6.0.0 <7.0.0"

fetchRetries: 5
fetchRetryMaxtimeout: 30000
fetchRetryMintimeout: 1000
fetchTimeout: 60000

permissions:
  arktype:
    skills: true
  fallow:
    skills: true

registries:
  "@jsr": https://npm.jsr.io

strictSsl: true
strictStorePkgContentCheck: true
verifyStoreIntegrity: true
