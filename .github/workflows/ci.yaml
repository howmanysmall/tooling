name: CI

on:
  push:
    branches:
      - main
    paths: &ci-paths
      - "**/*.markdown"
      - "**/*.md"
      - "**/*.mdx"
      - "*.config.ts"
      - ".github/actions/**"
      - .github/workflows/checks.yaml
      - .github/workflows/ci.yaml
      - ".ox*trc.json"
      - .vale.ini
      - "apps/**"
      - biome.jsonc
      - hk.pkl
      - mise.lock
      - mise.toml
      - package.json
      - "packages/**"
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "scripts/**"
      - "tools/**"
      - "tsconfig*.json"
  pull_request:
    paths: *ci-paths

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read
    uses: $/.github/workflows/checks.yaml

  vale:
    name: Vale
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: $/.github/actions/setup
        with:
          tools: vale

      # Styles live in gitignored `.vale/styles`; `Packages` in `.vale.ini` is the source.
      - name: Sync styles
        run: vale sync

      - name: Lint prose
        run: vale --no-color .
    timeout-minutes: 5

  workflow-security:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Workflow Security
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: changes
        name: Check if .github/ changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if git diff --name-only "$BASE" "$HEAD" 2>/dev/null | grep -q '^\.github/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.changed == 'true'
        name: Setup toolchain
        uses: $/.github/actions/setup
        with:
          tools: github:jdx/jactionlint pinact

      # `.github/jactionlint.yaml` turns on the online checks, which use this
      # token for the GitHub API.
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        if: steps.changes.outputs.changed == 'true'
        name: jactionlint
        run: jactionlint --format github

      - if: steps.changes.outputs.changed == 'true'
        name: pinact
        run: pinact run
    timeout-minutes: 5
