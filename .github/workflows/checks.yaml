name: Checks

on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: Validate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: $/.github/actions/setup

      - name: Install dependencies
        uses: $/.github/actions/install

      - name: Restore ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-eslint-v1-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.ts') }}-${{ github.sha }}
          path: .eslintcache*
          restore-keys: |
            ${{ runner.os }}-eslint-v1-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.ts') }}-

      # Workspace packages resolve each other's types from `dist`.
      - name: Build
        run: node --run build

      # isentinel-lint collapses ESLint into one full pass when `CI` is set.
      # Run the passes it splits locally side by side instead, each with its
      # own cache file.
      - parallel:
          - name: Lint (oxlint)
            run: pnpm exec isentinel-lint --oxlint .

          - name: Lint (ESLint, syntactic)
            run: pnpm exec isentinel-lint --eslint --type-aware=off .

          - name: Lint (ESLint, type-aware)
            run: pnpm exec isentinel-lint --eslint --type-aware=only .

          - name: Lint (Biome)
            run: node --run biome -- check --no-errors-on-unmatched .

      - name: Type Check
        run: node --run type-check

      - name: Dead code
        run: node --run fallow:dead-code

      - name: Duplication
        run: node --run fallow:dupes

  test:
    name: Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: $/.github/actions/setup

      - name: Install dependencies
        uses: $/.github/actions/install

      - parallel:
          - name: Run tests
            run: node --run turbo -- run test -- --reporter github-actions --reporter dot

          - name: Run fuzz regressions
            run: node --run test:fuzz
